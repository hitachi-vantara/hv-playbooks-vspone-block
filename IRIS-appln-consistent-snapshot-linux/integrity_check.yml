---
- name: IRIS Integrity Check and Snapshot Cleanup
  hosts: secondary-server
  become: true
  gather_facts: false

  vars_files:
    - var.yml
    - ansible_vault_vars/ansible_vault_storage_var.yml

  vars:

    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:

###############################################################################
# Change ownership
###############################################################################

    - name: Change ownership of mounted snapshot filesystems
      file:
        path: "{{ item }}"
        owner: root
        group: irisusr
        recurse: yes
      loop:
        - "{{ db_mount }}"
        - "{{ sys_mount }}"
        - "{{ jnl_mount }}"

###############################################################################
# Start IRIS
###############################################################################

    - name: Start IRIS instance
      command: iris start {{ iris_instance }}

###############################################################################
# Verify IRIS
###############################################################################

    - name: Verify IRIS status
      command: iris list
      register: iris_status

    - debug:
        var: iris_status.stdout_lines

    - name: Verify IRIS is running
      assert:
        that:
          - "'running' in iris_status.stdout | lower"
        fail_msg: IRIS instance failed to start.
        success_msg: IRIS instance is running.

###############################################################################
# Run IRIS Database Integrity Check
###############################################################################

    - name: Remove previous integrity log
      ansible.builtin.file:
        path: /root/t2.log
        state: absent

    - name: Start IRIS Integrity Check
      ansible.builtin.shell: |
        iris terminal {{ iris_instance }} -U%SYS <<'EOF'
        Do Silent^Integrity("/root/t2.log",$ListBuild("{{ db_dir }}"))
        L +^IntegrityCheck:20
        H 1
        halt
        EOF
      args:
        executable: /bin/bash
      register: integrity_command
      changed_when: true

###############################################################################
# Validate Integrity Check Log
###############################################################################

    - name: Check integrity log
      ansible.builtin.stat:
        path: /root/t2.log
      register: integrity_log_stat

    - name: Fail if integrity log is missing
      ansible.builtin.fail:
        msg: "IRIS integrity check FAILED: Integrity log was not generated."
      when: not integrity_log_stat.stat.exists

    - name: Read integrity check log
      ansible.builtin.slurp:
        src: /root/t2.log
      register: integrity_log

    - name: Validate database integrity result
      ansible.builtin.set_fact:
        integrity_log_text: "{{ integrity_log.content | b64decode }}"
        integrity_check_passed: >-
          {{
            (
              'Directory: ' ~ (db_dir | regex_replace('/?$', '/'))
              in (integrity_log.content | b64decode)
            )
            and
            (
              'No errors found'
              in (integrity_log.content | b64decode)
            )
            and
            (
              'Integrity Check Run Time'
              in (integrity_log.content | b64decode)
            )
          }}

###############################################################################
# Display Integrity Check Summary
###############################################################################

    - name: Display Integrity Check Summary
      ansible.builtin.debug:
        msg:
          - "======================================="
          - "       IRIS INTEGRITY CHECK SUMMARY"
          - "======================================="
          - "User Database : {{ db_dir }}"
          - "Result        : {{ 'PASSED' if integrity_check_passed | bool else 'FAILED' }}"
          - "{{ 'No errors found.' if integrity_check_passed | bool else 'Integrity check failed or could not be validated. Review /root/t2.log.' }}"
          - "======================================="

###############################################################################
# Stop Workflow on Integrity Check Failure
###############################################################################

    - name: Stop if integrity check failed
      ansible.builtin.fail:
        msg: >-
          IRIS integrity check FAILED for {{ db_dir }}.
          Review /root/t2.log before proceeding with recovery validation.
      when: not (integrity_check_passed | bool)

###############################################################################
# Workflow Completion
###############################################################################

    - name: Workflow Completed
      debug:
        msg:
          - "======================================="
          - "IRIS APPLICATION CONSISTENCY VALIDATION"
          - "Workflow Status : SUCCESS"
          - "Integrity Check : PASSED"
          - "======================================="
