---
- pause:
    prompt: "Enter array IP or FQDN"
  register: input

- set_fact:
    storage_address: "{{ input.user_input | trim }}"

- assert:
    that:
      - storage_address | length > 0
      - >
        (storage_address is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'))
        or
        (storage_address is match('^(?=.{1,253}$)(?:[A-Za-z0-9-]{1,63}\\.)+[A-Za-z]{2,}$'))

- debug:
    msg: "Storage address accepted: {{ storage_address }}"